services:
  - type: web
    name: nurin-irdina-portfolio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_PATH
        value: backend/data/portfolio.sqlite
      # Set manually in the Render dashboard after the first deploy (secrets,
      # and APP_ORIGIN depends on the URL Render assigns you or your custom domain):
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: email notification for new contact-form messages, via Brevo's API.
      # Leave unset to disable — see .env.example for setup steps.
      - key: NOTIFY_EMAIL
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
